name: homekonet
description: HomeKonet — Real Estate Booking Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^14.2.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP & networking
  dio: ^5.4.3
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  path_provider: ^2.1.3
  web_socket_channel: ^3.0.1

  # Secure storage (refresh token, credentials)
  flutter_secure_storage: ^9.2.2

  # Image handling
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

  # Local persistence
  shared_preferences: ^2.3.2

  # Auth
  google_sign_in: ^6.2.1

  # Payments
  flutter_stripe: ^10.1.1

  # UI utilities
  shimmer: ^3.0.0
  timeago: ^3.6.1
  intl: ^0.20.2
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  flutter_svg: ^2.0.10+1
  photo_view: ^0.15.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
